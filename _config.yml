title: Alike
url: "https://alikeapp.github.io"
# Organization Pages site: served from the domain root, so baseurl is empty.
# Every internal link goes through `relative_url`/`absolute_url`, so these two
# values are the only place the address is configured — including the privacy
# URL the app ships in SubscriptionConfiguration.swift.
baseurl: ""

contact_email: oleksandr.solokha@gmail.com

# Year of first publication, which is what a copyright line states — not the
# current year. Kept fixed so it stays aligned with COPYRIGHT in the app repo's
# tools/prepare_app_store_upload_bundle.py, which App Store Connect shows as
# "2026 Oleksandr Solokha. Alike". Auto-generating this from `now` would silently
# diverge from that field every January.
copyright_year: 2026

# No plugins. The sitemap is generated with Liquid in sitemap.xml and the SEO
# tags live in _includes/seo-meta.html, which keeps the build usable with
# actions/jekyll-build-pages and avoids plugin drift.
plugins: []

# The published locales, in the order the language switcher lists them. Every
# entry needs a `_data/<lang>.yml`, a page directory, and a `defaults` scope
# below; the build check in scripts/check-site.sh walks this list and fails on
# a locale that is missing any of its four pages.
#
# `es` is deliberately one page serving two App Store listings, es-ES and es-MX.
# The legal copy does not need the regional vocabulary split, so /es/ carries the
# Spain wording and also advertises hreflang="es-419" for the Latin American
# storefront. See _data/es.yml.
languages: [en, uk, de, fr, es, pt-BR]
default_lang: en

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  # Build tooling, not content. Without this Jekyll copies the checker into the
  # published site, where it is both a pointless public file and an input to its
  # own third-party-host scan.
  - scripts

sass:
  style: compressed

# URL paths are lowercase, the way the rest of the web writes them, while `lang`
# keeps Apple's casing because it is also the `_data/` filename, the `<html lang>`
# value and the hreflang tag. That is why the pt-BR scope path and its lang differ.
defaults:
  - scope:
      path: ""
    values:
      layout: page
      lang: en
  - scope:
      path: "uk"
    values:
      lang: uk
  - scope:
      path: "de"
    values:
      lang: de
  - scope:
      path: "fr"
    values:
      lang: fr
  - scope:
      path: "es"
    values:
      lang: es
  - scope:
      path: "pt-br"
    values:
      lang: pt-BR
