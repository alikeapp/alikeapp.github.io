name: Deploy landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages is not enabled on the repository yet; `enablement` lets the first
      # run create the site instead of failing with "Not Found".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # The gate is only worth its CI minutes if it fails when it should, so its
      # own regression tests run first.
      - name: Test the checker
        run: ./scripts/test-check-site.sh ./_site

      - name: Test App Store badge validation
        run: ./scripts/test-fetch-app-store-badges.sh

      # The locale matrix, internal links, hreflang, the Terms guardrails and the
      # third-party-host assertion all live in one script so this job and the
      # pull-request job in ci.yml gate on exactly the same thing.
      - name: Check the rendered site
        run: ./scripts/check-site.sh ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
