faq:
  title: Questions fréquentes
  items:
    - q: Alike envoie-t-elle mes photos quelque part ?
      a: "Non. Toute la comparaison se fait sur votre appareil avec le framework Vision d'Apple, et l'app n'effectue aucune requête réseau de son propre fait. La seule activité sortante est gérée par Apple lorsque vous achetez ou restaurez un abonnement."
    - q: Alike peut-elle supprimer des photos sans demander ?
      a: "Jamais. Vous choisissez ce qui doit être supprimé, Alike vous demande de confirmer, et iOS affiche sa propre confirmation avant toute suppression. Les photos supprimées vont dans « Supprimés récemment », où iOS les conserve environ 30 jours."
    - q: Ai-je besoin d'un compte ?
      a: "Non. Alike n'a ni compte, ni connexion, ni serveur. Vous ouvrez l'app et vous lancez une analyse."
    - q: À quoi Alike accède-t-elle exactement ?
      a: "À votre photothèque, demandée une seule fois au début. Vous pouvez accorder un accès complet ou un accès limité et choisir les photos qu'Alike peut voir, et le modifier à tout moment dans les Réglages iOS. L'autorisation de notification n'est demandée que si vous activez le rappel de nettoyage hebdomadaire."
    - q: Comment décide-t-elle que des photos se ressemblent ?
      a: "Chaque photo reçoit une empreinte numérique de caractéristiques du framework Vision. Les photos proches par la date de prise de vue et le lieu sont comparées, et une photo ne rejoint un groupe que si elle ressemble à toutes celles qu'il contient déjà. Le niveau de sensibilité définit ce que « proche » veut dire."
    - q: Qu'est-ce que la meilleure prise ?
      a: "Un choix déterministe de la photo la plus réussie de chaque groupe, pour qu'il y ait toujours une option sensée à conserver. Vous pouvez toujours la remplacer."
    - q: Comment résilier un abonnement ?
      a: "Dans les Réglages iOS, touchez votre nom, puis « Abonnements ». La résiliation arrête les renouvellements futurs et vous conservez l'accès jusqu'à la fin de la période payée. Les abonnements et les remboursements sont gérés par Apple, pas par nous."
    - q: Puis-je effacer tout ce qu'Alike a enregistré ?
      a: "Oui. Réglages, puis « Données et confidentialité », puis « Supprimer les données d'Alike ». Cela efface les résultats d'analyse, l'historique de nettoyage et les préférences, sans toucher à vos photos, à l'accès aux photos ni à votre abonnement."

