privacy:
  title: La confidentialité, c'est tout l'enjeu
  subtitle: "Nettoyer ses photos, c'est confier à une app la collection la plus personnelle qui soit. Alike est conçue pour qu'elle n'ait jamais à quitter vos mains."
  image_alt: "La mascotte se repose à côté d'une photothèque rangée et terminée."
  claims:
    - title: L'analyse s'exécute sur votre appareil
      body: "Le framework Vision d'Apple compare vos photos en local. Il n'existe aucun serveur Alike auquel envoyer quoi que ce soit."
    - title: Vos photos ne sont jamais envoyées
      body: "Aucune photo, aucune vignette, aucune empreinte de caractéristiques ne quitte jamais votre appareil."
    - title: Aucune analyse d'usage, aucun pistage
      body: "Aucun événement d'utilisation, aucun identifiant publicitaire, aucun SDK de rapport de plantage, aucun cookie. L'app n'effectue aucune requête réseau de son propre fait."
    - title: La suppression reste votre décision
      body: "Chaque nettoyage exige votre confirmation, iOS demande une seconde fois, et les photos atterrissent dans « Supprimés récemment »."
  cta: Lire la politique de confidentialité complète

