hero:
  eyebrow: iPhone
  headline: "Votre photothèque, sans les quasi-doublons."
  subhead: "Alike regroupe les photos qui se ressemblent, choisit la meilleure prise de chaque groupe et vous aide à supprimer le reste — sans qu'une seule photo quitte votre appareil."
  badge: Bientôt sur l'App Store
  badge_note: "Téléchargement gratuit, avec un abonnement Pro facultatif."
  trust: "Aucun compte. Aucun serveur. Rien n'est envoyé."
  image_alt: "La mascotte d'Alike, un personnage violet tenant une loupe au-dessus de deux photos."

steps:
  title: Comment ça marche
  subtitle: "Trois étapes, et vous gardez la main à chacune d'elles."
  items:
    - title: Analyser
      body: "Alike compare votre photothèque avec le framework Vision d'Apple, entièrement sur votre appareil. Les photos proches dans le temps et l'espace sont comparées ; les captures d'écran sont écartées, sauf si vous demandez à les inclure."
      image: step-scan
      image_alt: "La mascotte examine des photos à la loupe."
    - title: Passer en revue
      body: "Chaque groupe s'ouvre avec une meilleure prise déjà choisie, ce qui vous permet de décider en quelques secondes. Ne garder que la meilleure, tout sélectionner sauf la meilleure, ou choisir à la main."
      image: step-review
      image_alt: "La mascotte se réjouit à côté d'une meilleure photo mise en avant."
    - title: Nettoyer
      body: "Vous confirmez, et les photos choisies partent dans « Supprimés récemment », où iOS les conserve environ 30 jours. Rien n'est jamais supprimé sans votre accord."
      image: step-clean
      image_alt: "La mascotte exulte près d'une photothèque bien rangée."

features:
  title: Ce que vous obtenez
  items:
    - title: Analyse sur l'appareil
      body: "Chaque comparaison utilise le framework Vision d'Apple, en local. Aucun envoi, aucune file d'attente, aucun traitement dans le cloud."
    - title: Trois niveaux de sensibilité
      body: "Faible, moyen ou élevé. Resserrez le seuil pour ne viser que les prises quasi identiques, élargissez-le pour en attraper davantage."
    - title: Détection de la meilleure prise
      body: "Un choix déterministe de la photo la plus réussie de chaque groupe, pour qu'il y ait toujours une option sensée à conserver."
    - title: Revue guidée
      body: "Avancez groupe par groupe avec « Ne garder que la meilleure », « Tout sélectionner sauf la meilleure » et « Effacer la sélection »."
    - title: Badges de suivi
      body: "Nouveau, en cours, examiné, et à réexaminer après une nouvelle analyse. Vous savez toujours où vous en êtes."
    - title: Progression et espace gagné
      body: "Examinées, restantes, sélectionnées et espace estimé, ainsi qu'un historique de nettoyage groupé par mois."
    - title: Une mise en page qui vous convient
      body: "Une grille adaptative qui alterne entre une colonne aérée et un affichage plus dense, mémorisée d'un lancement à l'autre."
    - title: Douze langues, mode sombre
      body: "Anglais, ukrainien, allemand, français, espagnol, espagnol d'Amérique latine, portugais du Brésil, italien, néerlandais, polonais, turc et chinois traditionnel dans toute l'app, avec un mode sombre complet."

