meta:
  title: "Alike — trouver les photos visuellement similaires sur iPhone"
  description: "Alike trouve et regroupe les photos visuellement similaires de votre photothèque grâce à une analyse sur l'appareil, choisit la meilleure prise et vous aide à supprimer le reste. Sans compte, sans serveur, rien ne quitte votre iPhone."

