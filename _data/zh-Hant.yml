meta:
  title: "Alike — 在 iPhone 上找出視覺上相似的照片"
  description: "Alike 以裝置端分析找出並分組你照片圖庫中視覺上相似的照片，挑出最佳照片，並幫你清理其餘的。沒有帳戶、沒有伺服器，任何東西都不會離開你的 iPhone。"

