privacy:
  title: 隱私就是重點所在
  subtitle: "整理照片意味著把你最私密的收藏交給一個 App。Alike 從一開始就設計成讓它永遠不必離開你的手中。"
  image_alt: "吉祥物在整理完成的照片圖庫旁休息。"
  claims:
    - title: 分析在你的裝置上執行
      body: "Apple 的 Vision 框架在本機比對你的照片。並不存在可以傳送任何東西的 Alike 伺服器。"
    - title: 照片永遠不會被上傳
      body: "任何照片、縮覽圖或特徵指紋都不會離開你的裝置。"
    - title: 沒有分析追蹤，沒有行為追蹤
      body: "沒有使用事件、沒有廣告識別碼、沒有當機回報 SDK、沒有 Cookie。App 不會自行發出任何網路請求。"
    - title: 刪不刪永遠由你決定
      body: "每一次清理都需要你確認，iOS 還會再問一次，而照片會進入「最近刪除」。"
  cta: 閱讀完整隱私權政策

