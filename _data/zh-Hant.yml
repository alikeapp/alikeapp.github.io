faq:
  title: 常見問題
  items:
    - q: Alike 會把我的照片上傳到什麼地方嗎？
      a: "不會。所有比對都以 Apple 的 Vision 框架在你的裝置上執行，App 也不會自行發出網路請求。唯一的對外行為由 Apple 處理，也就是你購買或回復訂閱項目的時候。"
    - q: Alike 會不問就刪除照片嗎？
      a: "絕對不會。要移除什麼由你選擇，Alike 會請你確認，iOS 在刪除前還會顯示自己的確認。刪除的照片會進入「最近刪除」，iOS 會在那裡保留約 30 天。"
    - q: 我需要帳戶嗎？
      a: "不需要。Alike 沒有帳戶、不需登入，也沒有伺服器。打開 App 就能開始。"
    - q: Alike 到底會取用什麼？
      a: "你的照片圖庫，一開始詢問一次。你可以授予完整取用權，也可以授予有限取用權並自行選擇 Alike 看得到哪些照片；隨時都能在 iOS「設定」中更改。只有在你開啟每週清理提醒時，才會詢問通知權限。"
    - q: Alike 怎麼判斷哪些照片相似？
      a: "Vision 框架會為每張照片產生一組數值特徵指紋。系統只比對拍攝時間與地點相近的照片，而且一張照片必須與該組中所有照片都相似，才會被歸入該組。敏感度決定「多相似才算夠相似」。"
    - q: 什麼是最佳照片？
      a: "以可理解的方式挑出每一組中最好的一張，讓你永遠有一個合理的保留預設值。你隨時可以自行改選。"
    - q: 我要怎麼取消訂閱？
      a: "在 iOS「設定」中點一下你的名字，再點「訂閱項目」。取消後不再自動續訂，已付費的期間內仍可繼續使用。訂閱與退款由 Apple 處理，不是由我們處理。"
    - q: 我可以刪掉 Alike 儲存的所有東西嗎？
      a: "可以。「設定」→「資料與隱私權」→「刪除 Alike 資料」。這會清除掃描結果、清理記錄與偏好設定，而你的照片、照片取用權與訂閱項目都不受影響。"

