hero:
  eyebrow: iPhone
  headline: "你的照片圖庫，沒有那些近乎重複的照片。"
  subhead: "Alike 會把看起來相像的照片分成一組組，在每一組中挑出最佳照片，並幫你清理其餘的——而且沒有任何一張照片會離開你的裝置。"
  badge: 從 App Store 下載
  badge_note: "免費下載，可選購 Pro 訂閱。"
  trust: "沒有帳戶。沒有伺服器。不會上傳任何東西。"
  image_alt: "Alike 的吉祥物，一個紫色角色拿著放大鏡在兩張照片上方。"

steps:
  title: 運作方式
  subtitle: "三個步驟，每一步都由你作主。"
  items:
    - title: 掃描
      body: "Alike 以 Apple 的 Vision 框架比對你的照片圖庫，全程在你的裝置上完成。系統只比對拍攝時間與地點相近的照片；螢幕快照除非你特別納入，否則不會出現在結果中。"
      image: step-scan
      image_alt: "吉祥物拿著放大鏡在照片裡尋找。"
    - title: 檢視
      body: "每一組打開時都已選好最佳照片，你只需幾秒就能決定。可以只保留最佳照片、選取除最佳照片外的全部，或自行手動挑選。"
      image: step-review
      image_alt: "吉祥物在一張被標示為最佳的照片旁開心地笑著。"
    - title: 清理
      body: "確認之後，選取的照片會移到「最近刪除」，iOS 會在那裡保留約 30 天。未經你同意，不會移除任何東西。"
      image: step-clean
      image_alt: "吉祥物在整理好的照片圖庫旁歡呼。"

features:
  title: 你會得到什麼
  items:
    - title: 裝置端分析
      body: "每一次比對都透過 Apple 的 Vision 框架在本機執行。不上傳、不排隊、不在雲端處理。"
    - title: 三種敏感度
      body: "低、中或高。想只看幾乎完全相同的照片就調緊，想撈得更廣就放寬。"
    - title: 最佳照片偵測
      body: "以可理解的方式挑出每一組中最好的一張，讓你永遠有一個合理的保留預設值。"
    - title: 引導式檢視
      body: "一組一組處理，可用「只保留最佳照片」、「選取除最佳照片外的全部」與「取消選取」。"
    - title: 狀態標記
      body: "新項目、檢視中、已檢視，以及重新掃描後的待檢視。你隨時知道自己看到哪裡。"
    - title: 進度與可省空間
      body: "已檢視、剩餘、已選取與預估可省空間，另有依月份分組的清理歷史記錄。"
    - title: 適合你的版面
      body: "可自動調整的格線，在寬鬆的單欄與較緊湊的檢視之間切換，並在下次啟動時記住你的選擇。"
    - title: 十二種語言、深色模式
      body: "英文、烏克蘭文、德文、法文、西班牙文、拉丁美洲西班牙文、巴西葡萄牙文、義大利文、荷蘭文、波蘭文、土耳其文與繁體中文，全程支援，並完整支援深色模式。"

