faq:
  title: أسئلة شائعة
  items:
    - q: هل يرفع Alike صوري إلى أي مكان؟
      a: "لا. تجري كل المقارنات على جهازك بإطار عمل Vision من Apple، ولا يقوم التطبيق بأي طلبات شبكة خاصة به. النشاط الخارجي الوحيد تتولاه Apple عند شرائك اشتراكًا أو استعادته."
    - q: هل يحذف Alike الصور دون أن يسأل؟
      a: "أبدًا. أنت تحدد ما يُزال، ويطلب Alike تأكيدك، ثم يعرض iOS تأكيده الخاص قبل حذف أي شيء. وتنتقل الصور المحذوفة إلى «المحذوفة مؤخرًا»، حيث يحتفظ بها iOS نحو 30 يومًا."
    - q: هل أحتاج إلى حساب؟
      a: "لا. ليس لـ Alike حساب ولا تسجيل دخول ولا خادم. تفتح التطبيق وتبدأ الفحص."
    - q: إلى ماذا يصل Alike فعليًا؟
      a: "إلى مكتبة صورك، ويُطلب ذلك مرة واحدة في البداية. يمكنك منح وصول كامل أو وصول محدود واختيار الصور التي يراها Alike، وتغيير ذلك في أي وقت من إعدادات iOS. ولا يُطلب إذن الإشعارات إلا إذا فعّلت تذكير التنظيف الأسبوعي."
    - q: كيف يقرر أي الصور متشابهة؟
      a: "تحصل كل صورة على بصمة سمات رقمية من إطار عمل Vision. وتُقارن الصور المتقاربة في وقت الالتقاط والموقع، ولا تنضم صورة إلى مجموعة إلا إذا كانت مشابهة لكل صورة فيها بالفعل. ومستوى الحساسية يحدد مقدار التشابه الكافي."
    - q: ما هي «أفضل لقطة»؟
      a: "اختيار حتمي لأقوى صورة في كل مجموعة، فيكون هناك دائمًا خيار افتراضي معقول للاحتفاظ به. ويمكنك تجاوزه دائمًا."
    - q: كيف ألغي اشتراكًا؟
      a: "من إعدادات iOS، انقر اسمك، ثم «الاشتراكات». يوقف الإلغاء التجديدات المستقبلية وتحتفظ بالوصول حتى نهاية الفترة المدفوعة. وتتولى Apple الاشتراكات والمبالغ المستردة، لا نحن."
    - q: هل يمكنني محو كل ما خزّنه Alike؟
      a: "نعم. الإعدادات، ثم البيانات والخصوصية، ثم «حذف بيانات Alike». يمحو ذلك نتائج الفحص وسجل التنظيف والتفضيلات، ويترك صورك وإذن الوصول واشتراكك دون مساس."

support:
  title: الدعم
  subtitle: "بلا حسابات وبلا نظام تذاكر. أرسل رسالة بريد وستصلك إجابة."
  contact_title: تواصل معنا
  contact_body: "البريد الإلكتروني أسرع طريقة للوصول إلينا. اذكر إصدار iOS وجهازك وما الذي كنت تتوقع حدوثه."
  response: "توقّع ردًا خلال بضعة أيام."
  before_title: قبل أن تكتب
  before_body: "يغطي الدليل داخل التطبيق معظم ما يسأل عنه الناس. افتح Alike، ثم الإعدادات، ثم «طريقة الاستخدام»."
  bug_title: الإبلاغ عن خلل
  bug_body: "يُرجى وصف ما فعلته، وما توقعته، وما حدث بدلًا من ذلك. ولا ترسل صورًا من مكتبتك — لا نحتاج إليها ونفضّل ألا نستلمها."
  details_title: "تفاصيل مفيدة يُستحسن ذكرها:"
  details:
    - "طراز iPhone وإصدار iOS لديك"
    - "إصدار Alike، الظاهر أسفل الإعدادات"
    - "ما فعلته، وما توقعته، وما حدث بدلًا من ذلك"
    - "ما إذا كان إذن مكتبة الصور مضبوطًا على وصول كامل أو وصول محدود"
  privacy_title: أسئلة الخصوصية
  privacy_body: "ليس لـ Alike خادم ولا يجمع شيئًا، فلا توجد بيانات حساب يمكن تصديرها أو حذفها. وتشرح سياسة الخصوصية ذلك بالكامل، ويمحو «حذف بيانات Alike» في الإعدادات كل ما هو مخزَّن على جهازك."
  subs_title: الاشتراكات والمبالغ المستردة
  subs_body: "تبيع Apple اشتراك Alike Pro. وتُدار الاشتراكات والإلغاءات والمبالغ المستردة بالكامل عبر حساب Apple الخاص بك، ولا يمكننا الإلغاء أو رد المبلغ نيابةً عنك."
  subs_manage: "للإدارة أو الإلغاء: إعدادات iOS ← اسمك ← الاشتراكات"
  subs_refund_prefix: "لطلب استرداد المبلغ:"
  subs_refund_link: "إجراء الاسترداد لدى Apple"
  subs_restore: "لاستعادة عملية شراء على جهاز جديد: إعدادات Alike ← استعادة المشتريات"

