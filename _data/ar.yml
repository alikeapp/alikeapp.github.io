privacy:
  title: الخصوصية هي الفكرة كلها
  subtitle: "تنظيف الصور يعني أن تسلّم تطبيقًا أكثر مكتباتك خصوصية. صُمّم Alike بحيث لا تضطر أبدًا إلى إخراجها من يديك."
  image_alt: "الشخصية تستريح بجوار مكتبة صور مرتّبة ومكتملة."
  claims:
    - title: التحليل يجري على جهازك
      body: "يقارن إطار عمل Vision من Apple صورك محليًا. ولا يوجد خادم لـ Alike يمكن إرسال أي شيء إليه."
    - title: لا تُرفع الصور أبدًا
      body: "لا تغادر جهازك أي صورة أو صورة مصغّرة أو بصمة سمات."
    - title: لا تحليلات ولا تتبّع
      body: "لا أحداث استخدام، ولا معرّفات إعلانية، ولا حزمة لتقارير الأعطال، ولا ملفات تعريف ارتباط. ولا يجري التطبيق أي طلبات شبكة خاصة به."
    - title: الحذف قرارك دائمًا
      body: "كل عملية تنظيف تحتاج إلى تأكيدك، ويسأل iOS مرة ثانية، ثم تنتهي الصور إلى «المحذوفة مؤخرًا»."
  cta: اقرأ سياسة الخصوصية كاملة

