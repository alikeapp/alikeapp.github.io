hero:
  eyebrow: iPhone
  headline: "مكتبتك، بلا الصور شبه المكررة."
  subhead: "يجمّع Alike الصور المتشابهة، ويختار أفضل لقطة في كل مجموعة، ويساعدك على إزالة الباقي — دون أن تغادر صورة واحدة جهازك."
  badge: التنزيل من App Store
  badge_note: "التنزيل مجاني، مع اشتراك Pro اختياري."
  trust: "بلا حساب. بلا خادم. لا يُرفع أي شيء."
  image_alt: "شخصية Alike، كائن بنفسجي يحمل عدسة مكبّرة فوق صورتين."

steps:
  title: كيف يعمل
  subtitle: "ثلاث خطوات، وأنت المتحكم في كل واحدة منها."
  items:
    - title: الفحص
      body: "يقارن Alike مكتبتك بإطار عمل Vision من Apple، والعملية كلها تجري على جهازك. تُقارن الصور المتقاربة في الزمان والمكان؛ وتبقى لقطات الشاشة خارج النتائج ما لم تطلبها."
      image: step-scan
      image_alt: "الشخصية تبحث بين الصور بعدسة مكبّرة."
    - title: المراجعة
      body: "تُفتح كل مجموعة وقد اختيرت فيها أفضل لقطة سلفًا، فتقرر في ثوانٍ. احتفظ بالأفضل فقط، أو حدد الكل ما عدا الأفضل، أو اختر يدويًا."
      image: step-review
      image_alt: "الشخصية تحتفي بجوار أفضل صورة مميّزة."
    - title: التنظيف
      body: "أكّد، فتنتقل الصور التي اخترتها إلى «المحذوفة مؤخرًا»، حيث يحتفظ بها iOS نحو 30 يومًا. ولا يُزال شيء أبدًا دون موافقتك."
      image: step-clean
      image_alt: "الشخصية مبتهجة بجوار مكتبة صور مرتّبة."

features:
  title: ما الذي تحصل عليه
  items:
    - title: تحليل على الجهاز
      body: "تجري كل مقارنة بإطار عمل Vision من Apple، محليًا. لا رفع، ولا طوابير انتظار، ولا معالجة سحابية."
    - title: ثلاثة مستويات حساسية
      body: "منخفضة أو متوسطة أو عالية. شدّ العتبة حين تريد اللقطات شبه المتطابقة فقط، أو أرخِها لتلتقط المزيد."
    - title: كشف أفضل لقطة
      body: "اختيار حتمي لأقوى صورة في كل مجموعة، فيكون هناك دائمًا خيار افتراضي معقول للاحتفاظ به."
    - title: مراجعة موجَّهة
      body: "اعمل على مجموعة واحدة في كل مرة مع «احتفظ بالأفضل فقط» و«حدد الكل ما عدا الأفضل» و«مسح التحديد»."
    - title: شارات المراجعة
      body: "جديدة، وقيد المراجعة، وتمت مراجعتها، وبحاجة إلى مراجعة بعد إعادة الفحص. تعرف دائمًا أين توقفت."
    - title: التقدّم والتوفير
      body: "تمت مراجعتها، والمتبقي، والمحدد، والتوفير التقديري، إضافة إلى سجل تنظيف مجمَّع حسب الشهر."
    - title: تخطيط يناسبك
      body: "شبكة متكيّفة تنتقل بين عمود واحد فسيح وتخطيط أكثر كثافة، ويُحفظ اختيارك بين عمليات التشغيل."
    # Keep this count in step with the app's catalogs, not with the languages
    # this site is published in.
    - title: ثلاث عشرة لغة، ووضع داكن
      body: "الإنجليزية والأوكرانية والألمانية والفرنسية والإسبانية وإسبانية أمريكا اللاتينية والبرتغالية البرازيلية والإيطالية والهولندية والبولندية والتركية والصينية التقليدية والعربية في كل مكان، ودعم كامل للوضع الداكن."

