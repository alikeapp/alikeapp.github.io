meta:
  title: "Alike — اعثر على الصور المتشابهة بصريًا على iPhone"
  description: "يعثر Alike على الصور المتشابهة بصريًا في مكتبتك ويجمّعها بتحليل يجري على الجهاز، ويختار أفضل لقطة، ويساعدك على إزالة الباقي. بلا حساب، وبلا خادم، ولا يغادر شيء جهاز iPhone."

