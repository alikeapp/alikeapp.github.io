  bug_body: "Beschreibe bitte, was du getan hast, was du erwartet hast und was stattdessen passiert ist. Schicke keine Fotos aus deiner Mediathek — wir brauchen sie nicht und möchten sie lieber nicht erhalten."
  details_title: "Nützliche Angaben:"
  details:
    - "Dein iPhone-Modell und deine iOS-Version"
    - "Die Alike-Version, unten in den Einstellungen zu sehen"
    - "Was du getan hast, was du erwartet hast und was stattdessen passiert ist"
    - "Ob die Berechtigung für die Fotomediathek auf vollen oder eingeschränkten Zugriff steht"
  privacy_title: Fragen zum Datenschutz
  privacy_body: "Alike hat keinen Server und erhebt nichts, es gibt also keine Accountdaten zum Exportieren oder Löschen. Die Datenschutzrichtlinie erklärt das vollständig, und „Alike-Daten löschen“ in den Einstellungen entfernt alles, was auf deinem Gerät gespeichert ist."
  subs_title: Abos und Rückerstattungen
  subs_body: "Alike Pro wird von Apple verkauft. Abos, Kündigungen und Rückerstattungen laufen vollständig über deinen Apple-Account, und wir können weder für dich kündigen noch erstatten."
