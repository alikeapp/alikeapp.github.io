steps:
  title: So funktioniert es
  subtitle: "Drei Schritte, und bei jedem behältst du die Kontrolle."
  items:
    - title: Scannen
      body: "Alike vergleicht deine Mediathek mit Apples Vision-Framework, vollständig auf deinem Gerät. Verglichen werden Fotos, die zeitlich und örtlich nah beieinander liegen; Bildschirmfotos bleiben außen vor, sofern du sie nicht ausdrücklich einbeziehst."
      image: step-scan
      image_alt: "Das Maskottchen durchsucht Fotos mit einer Lupe."
    - title: Durchsehen
      body: "Jede Gruppe öffnet sich mit einer bereits gewählten besten Aufnahme, sodass du in Sekunden entscheiden kannst. Nur die beste behalten, alle außer der besten auswählen oder von Hand entscheiden."
      image: step-review
      image_alt: "Das Maskottchen freut sich neben einem hervorgehobenen besten Foto."
    - title: Aufräumen
      body: "Bestätige, und die ausgewählten Fotos wandern nach „Zuletzt gelöscht“, wo iOS sie etwa 30 Tage aufbewahrt. Nichts wird jemals ohne dein Wort entfernt."
      image: step-clean
      image_alt: "Das Maskottchen jubelt neben einer aufgeräumten Fotomediathek."

features:
  title: Das bekommst du
  items:
    - title: Analyse auf dem Gerät
      body: "Jeder Vergleich läuft lokal über Apples Vision-Framework. Kein Upload, keine Warteschlange, keine Verarbeitung in der Cloud."
    - title: Drei Empfindlichkeitsstufen
      body: "Niedrig, mittel oder hoch. Enger, wenn du nur nahezu identische Aufnahmen willst, weiter, um mehr zu erfassen."
    - title: Beste Aufnahme erkennen
      body: "Eine nachvollziehbare Wahl des stärksten Fotos jeder Gruppe, damit es immer eine sinnvolle Voreinstellung zum Behalten gibt."
    - title: Geführtes Durchsehen
      body: "Arbeite Gruppe für Gruppe mit „Nur beste behalten“, „Alle außer der besten auswählen“ und „Auswahl aufheben“."
    - title: Status-Markierungen
      body: "Neu, in Prüfung, geprüft und nach einem erneuten Scan zu prüfen. Du weißt immer, wo du aufgehört hast."
    - title: Fortschritt und Ersparnis
      body: "Geprüft, verbleibend, ausgewählt und geschätzte Ersparnis, dazu ein nach Monaten gruppierter Aufräumverlauf."
    - title: Ein Layout, das zu dir passt
      body: "Ein adaptives Raster, das zwischen einer großzügigen einspaltigen und einer dichteren Ansicht wechselt und sich zwischen Starts merkt."
    - title: Sieben Sprachen, Dunkelmodus
      body: "Englisch, Ukrainisch, Deutsch, Französisch, Spanisch, lateinamerikanisches Spanisch und brasilianisches Portugiesisch durchgehend, dazu vollständiger Dunkelmodus."

