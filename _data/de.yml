      body: "Apples Vision-Framework vergleicht deine Fotos lokal. Es gibt keinen Alike-Server, an den sich etwas senden ließe."
    - title: Fotos werden nie hochgeladen
      body: "Kein Foto, keine Miniatur und kein Merkmalsabdruck verlässt jemals dein Gerät."
    - title: Keine Analyse-Tools, kein Tracking
      body: "Keine Nutzungsereignisse, keine Werbe-IDs, kein Crash-Reporting-SDK, keine Cookies. Die App stellt von sich aus keine Netzwerkanfragen."
    - title: Löschen entscheidest immer du
      body: "Jedes Aufräumen braucht deine Bestätigung, iOS fragt ein zweites Mal, und die Fotos landen in „Zuletzt gelöscht“."
  cta: Die vollständige Datenschutzrichtlinie lesen

