faq:
  title: Häufige Fragen
  items:
    - q: Lädt Alike meine Fotos irgendwohin hoch?
      a: "Nein. Der gesamte Vergleich läuft mit Apples Vision-Framework auf deinem Gerät, und die App stellt von sich aus keine Netzwerkanfragen. Die einzige ausgehende Aktivität übernimmt Apple, wenn du ein Abo kaufst oder wiederherstellst."
    - q: Löscht Alike Fotos, ohne zu fragen?
      a: "Niemals. Du wählst aus, was entfernt werden soll, Alike bittet dich um Bestätigung, und iOS zeigt seine eigene Bestätigung, bevor etwas gelöscht wird. Gelöschte Fotos wandern nach „Zuletzt gelöscht“, wo iOS sie etwa 30 Tage aufbewahrt."
    - q: Brauche ich einen Account?
      a: "Nein. Alike hat keinen Account, keine Anmeldung und keinen Server. Du öffnest die App und legst los."
    - q: Worauf greift Alike eigentlich zu?
      a: "Auf deine Fotomediathek, einmal zu Beginn angefragt. Du kannst vollen Zugriff gewähren oder eingeschränkten Zugriff und selbst wählen, welche Fotos Alike sehen darf; ändern kannst du das jederzeit in den iOS-Einstellungen. Nach Mitteilungen wird nur gefragt, wenn du die wöchentliche Aufräum-Erinnerung einschaltest."
    - q: Wie entscheidet Alike, welche Fotos ähnlich sind?
      a: "Jedes Foto erhält vom Vision-Framework einen numerischen Merkmalsabdruck. Verglichen werden Fotos, die zeitlich und örtlich nah beieinander liegen, und ein Foto kommt nur dann in eine Gruppe, wenn es allen bereits enthaltenen Fotos ähnelt. Die Empfindlichkeitsstufe legt fest, wie ähnlich ähnlich genug ist."
    - q: Was ist die beste Aufnahme?
      a: "Eine nachvollziehbare Wahl des stärksten Fotos jeder Gruppe, damit es immer eine sinnvolle Voreinstellung zum Behalten gibt. Du kannst sie jederzeit überstimmen."
    - q: Wie kündige ich ein Abo?
      a: "In den iOS-Einstellungen auf deinen Namen tippen, dann „Abos“. Eine Kündigung stoppt künftige Verlängerungen, und der Zugriff bleibt bis zum Ende des bezahlten Zeitraums bestehen. Abos und Rückerstattungen wickelt Apple ab, nicht wir."
    - q: Kann ich alles löschen, was Alike gespeichert hat?
      a: "Ja. Einstellungen, dann „Daten & Datenschutz“, dann „Alike-Daten löschen“. Das löscht Scan-Ergebnisse, Aufräumverlauf und Einstellungen und lässt deine Fotos, den Fotozugriff und das Abo unberührt."

support:
  title: Support
  subtitle: "Kein Account, kein Ticketsystem. Schreib eine E-Mail, und du bekommst eine Antwort."
  contact_title: Kontakt aufnehmen
  contact_body: "Per E-Mail erreichst du uns am schnellsten. Nenne deine iOS-Version, dein Gerät und was du erwartet hast."
  response: "Mit einer Antwort ist innerhalb weniger Tage zu rechnen."
  before_title: Bevor du schreibst
  before_body: "Die App-interne Anleitung deckt das meiste ab, wonach gefragt wird. Öffne Alike, gehe zu Einstellungen und dann zu „Bedienung“."
