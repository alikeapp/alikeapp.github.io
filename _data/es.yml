  privacy_body: "Alike no tiene servidor y no recopila nada, así que no hay datos de cuenta que exportar o eliminar. La política de privacidad lo explica por completo, y «Eliminar datos de Alike» en Ajustes borra todo lo guardado en tu dispositivo."
  subs_title: Suscripciones y reembolsos
  subs_body: "Alike Pro lo vende Apple. Las suscripciones, las cancelaciones y los reembolsos se gestionan por completo a través de tu cuenta de Apple, y no podemos cancelar ni reembolsar en tu nombre."
