  # Idéntico palabra por palabra al aviso de la paywall, cuya fuente es
  # Docs/legal/subscription-disclosure.md (bloque ES, no ES-419).
  # PurchasesUITests/SubscriptionDisclosureTests fija la versión de la app; esta
  # página no debe convertirse en una tercera copia divergente.
  disclosure_renewal: "Las suscripciones se renuevan automáticamente a menos que se cancelen al menos 24 horas antes de que finalice el periodo actual. El pago se carga a tu cuenta de Apple."
  disclosure_trial: "El plan anual incluye una prueba gratuita de 7 días para los nuevos suscriptores que cumplan los requisitos. El cobro empieza cuando termina la prueba, a menos que canceles al menos 24 horas antes. Puedes gestionar o cancelar la suscripción cuando quieras en Ajustes de iOS."

faq:
  title: Preguntas frecuentes
  items:
    - q: ¿Alike sube mis fotos a algún sitio?
      a: "No. Toda la comparación ocurre en tu dispositivo con el framework Vision de Apple, y la app no hace ninguna petición de red por su cuenta. La única actividad saliente la gestiona Apple cuando compras o restauras una suscripción."
    - q: ¿Alike elimina fotos sin preguntar?
      a: "Nunca. Tú eliges qué quitar, Alike te pide confirmación, y iOS muestra su propia confirmación antes de eliminar nada. Las fotos eliminadas van a «Eliminados recientemente», donde iOS las guarda unos 30 días."
    - q: ¿Necesito una cuenta?
      a: "No. Alike no tiene cuenta, ni inicio de sesión, ni servidor. Abres la app y empiezas a analizar."
    - q: ¿A qué accede Alike exactamente?
      a: "A tu fototeca, que se solicita una vez al principio. Puedes conceder acceso completo o acceso limitado y elegir qué fotos puede ver Alike, y cambiarlo cuando quieras en Ajustes de iOS. El permiso de notificaciones solo se pide si activas el recordatorio semanal de limpieza."
    - q: ¿Cómo decide qué fotos son similares?
      a: "Cada foto recibe una huella numérica de características del framework Vision. Se comparan las fotos cercanas en fecha de captura y ubicación, y una foto solo entra en un grupo si se parece a todas las que ya están en él. El nivel de sensibilidad marca cuánto parecido es suficiente."
    - q: ¿Qué es la mejor toma?
      a: "Una elección determinista de la foto más lograda de cada grupo, para que siempre haya una opción razonable que conservar. Siempre puedes cambiarla."
    - q: ¿Cómo cancelo una suscripción?
      a: "En Ajustes de iOS, toca tu nombre y luego «Suscripciones». Cancelar detiene las renovaciones futuras y conservas el acceso hasta que termine el periodo pagado. Las suscripciones y los reembolsos los gestiona Apple, no nosotros."
    - q: ¿Puedo borrar todo lo que Alike ha guardado?
      a: "Sí. Ajustes, luego «Datos y privacidad», luego «Eliminar datos de Alike». Borra los resultados de análisis, el historial de limpieza y las preferencias, y deja intactas tus fotos, el acceso a fotos y la suscripción."

