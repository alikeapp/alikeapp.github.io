hero:
  eyebrow: iPhone
  headline: "Tu fototeca, sin los casi duplicados."
  subhead: "Alike agrupa las fotos que se parecen, elige la mejor toma de cada grupo y te ayuda a eliminar el resto, sin que una sola foto salga de tu dispositivo."
  badge: Descargar en el App Store
  badge_note: "Descarga gratuita, con una suscripción Pro opcional."
  trust: "Sin cuenta. Sin servidor. No se sube nada."
  image_alt: "La mascota de Alike, un personaje morado con una lupa sobre dos fotos."

steps:
  title: Cómo funciona
  subtitle: "Tres pasos, y en todos mantienes el control."
  items:
    - title: Analizar
      body: "Alike compara tu fototeca con el framework Vision de Apple, siempre en tu dispositivo. Se comparan las fotos cercanas en tiempo y lugar; las capturas de pantalla quedan fuera salvo que pidas incluirlas."
      image: step-scan
      image_alt: "La mascota busca entre fotos con una lupa."
    - title: Revisar
      body: "Cada grupo se abre con la mejor toma ya elegida, así decides en segundos. Conservar solo la mejor, seleccionar todo excepto la mejor, o elegir a mano."
      image: step-review
      image_alt: "La mascota celebra junto a la mejor foto destacada."
    - title: Limpiar
      body: "Confirmas y las fotos que elegiste pasan a «Eliminados recientemente», donde iOS las guarda unos 30 días. Nunca se elimina nada sin que lo digas tú."
      image: step-clean
      image_alt: "La mascota festeja junto a una fototeca ordenada."

features:
  title: Lo que incluye
  items:
    - title: Análisis en el dispositivo
      body: "Cada comparación usa el framework Vision de Apple, en local. No hay subida, ni cola, ni procesamiento en la nube."
    - title: Tres niveles de sensibilidad
      body: "Bajo, medio o alto. Ajusta el umbral si solo quieres tomas casi idénticas, o ábrelo para detectar más."
    - title: Detección de la mejor toma
      body: "Una elección determinista de la foto más lograda de cada grupo, para que siempre haya una opción razonable que conservar."
    - title: Revisión guiada
      body: "Avanza grupo a grupo con «Conservar solo la mejor», «Seleccionar todo excepto la mejor» y «Borrar selección»."
    - title: Marcas de revisión
      body: "Nueva, en revisión, revisada, y pendiente de revisar tras un nuevo análisis. Siempre sabes dónde lo dejaste."
    - title: Progreso y ahorro
      body: "Revisadas, restantes, seleccionadas y ahorro estimado, además de un historial de limpieza agrupado por meses."
    - title: Un diseño que se adapta a ti
      body: "Una cuadrícula adaptable que alterna entre una columna amplia y una vista más densa, y que se recuerda entre sesiones."
    - title: Doce idiomas, modo oscuro
      body: "Inglés, ucraniano, alemán, francés, español, español de Latinoamérica, portugués de Brasil, italiano, neerlandés, polaco, turco y chino tradicional en toda la app, con modo oscuro completo."

screenshots:
  title: Un vistazo por dentro
  subtitle: "Pantallas de la app."
  pending: "Las capturas se están preparando antes del lanzamiento."

privacy:
  title: La privacidad es todo el sentido
  subtitle: "Limpiar fotos significa confiar a una app tu colección más personal. Alike está hecha para que nunca tenga que salir de tus manos."
  image_alt: "La mascota descansa junto a una fototeca ordenada y terminada."
  claims:
    - title: El análisis ocurre en tu dispositivo
      body: "El framework Vision de Apple compara tus fotos en local. No existe ningún servidor de Alike al que enviar nada."
    - title: Tus fotos nunca se suben
      body: "Ninguna foto, miniatura ni huella de características sale jamás de tu dispositivo."
    - title: Sin analítica, sin rastreo
      body: "Sin eventos de uso, sin identificadores publicitarios, sin SDK de informes de fallos, sin cookies. La app no hace ninguna petición de red por su cuenta."
    - title: Eliminar siempre lo decides tú
      body: "Cada limpieza necesita tu confirmación, iOS pregunta una segunda vez, y las fotos acaban en «Eliminados recientemente»."
  cta: Leer la política de privacidad completa

