# Registro: tuteo, igual que el aviso de suscripción de
# Docs/legal/subscription-disclosure.md. El vocabulario del sistema sigue la
# terminología de Apple en español — «Eliminados recientemente», «capturas de
# pantalla», y «Ajustes» (variante de España, no «Configuración»).
meta:
  title: "Alike — encuentra fotos visualmente similares en tu iPhone"
  description: "Alike encuentra y agrupa fotos visualmente similares de tu fototeca mediante análisis en el dispositivo, elige la mejor toma y te ayuda a eliminar el resto. Sin cuenta, sin servidor, nada sale de tu iPhone."

