faq:
  title: Perguntas comuns
  items:
    - q: O Alike envia minhas fotos para algum lugar?
      a: "Não. Toda a comparação acontece no seu aparelho com o framework Vision da Apple, e o app não faz nenhuma requisição de rede por conta própria. A única atividade de saída é feita pela Apple quando você compra ou restaura uma assinatura."
    - q: O Alike apaga fotos sem perguntar?
      a: "Nunca. Você seleciona o que remover, o Alike pede confirmação, e o iOS mostra a própria confirmação antes de apagar qualquer coisa. As fotos apagadas vão para \"Apagados recentemente\", onde o iOS as guarda por cerca de 30 dias."
    - q: Preciso de uma conta?
      a: "Não. O Alike não tem conta, nem login, nem servidor. Você abre o app e começa a analisar."
    - q: O que o Alike acessa de fato?
      a: "Sua fototeca, solicitada uma vez no começo. Você pode dar acesso completo ou acesso limitado e escolher quais fotos o Alike pode ver, e mudar isso quando quiser nos Ajustes do iOS. A permissão de notificações só é pedida se você ativar o lembrete semanal de limpeza."
    - q: Como ele decide quais fotos são parecidas?
      a: "Cada foto recebe uma impressão numérica de características do framework Vision. Fotos próximas na data e no local da captura são comparadas, e uma foto só entra em um grupo se for parecida com todas as que já estão nele. O nível de sensibilidade define o quanto de parecido é suficiente."
    - q: O que é a melhor foto?
      a: "Uma escolha determinística da foto mais forte de cada grupo, para que sempre haja uma opção sensata a manter. Você sempre pode trocar."
    - q: Como cancelo uma assinatura?
      a: "Nos Ajustes do iOS, toque no seu nome e depois em \"Assinaturas\". Cancelar interrompe as renovações futuras e você mantém o acesso até o fim do período pago. Assinaturas e reembolsos são tratados pela Apple, não por nós."
    - q: Posso apagar tudo o que o Alike guardou?
      a: "Sim. Ajustes, depois \"Dados e Privacidade\", depois \"Apagar dados do Alike\". Isso apaga resultados de análise, histórico de limpeza e preferências, e não toca nas suas fotos, no acesso às fotos nem na assinatura."

