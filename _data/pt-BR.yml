privacy:
  title: Privacidade é o ponto inteiro
  subtitle: "Limpar fotos significa entregar a um app a sua coleção mais pessoal. O Alike foi feito para que ela nunca precise sair das suas mãos."
  image_alt: "O mascote descansando ao lado de uma fototeca arrumada e finalizada."
  claims:
    - title: A análise roda no seu aparelho
      body: "O framework Vision da Apple compara suas fotos localmente. Não existe servidor do Alike para onde enviar qualquer coisa."
    - title: As fotos nunca são enviadas
      body: "Nenhuma foto, miniatura ou impressão de características sai do seu aparelho."
    - title: Sem análise de uso, sem rastreamento
      body: "Sem eventos de uso, sem identificadores de publicidade, sem SDK de relatório de falhas, sem cookies. O app não faz nenhuma requisição de rede por conta própria."
    - title: Apagar é sempre decisão sua
      body: "Toda limpeza precisa da sua confirmação, o iOS pergunta uma segunda vez, e as fotos vão para \"Apagados recentemente\"."
  cta: Ler a política de privacidade completa

