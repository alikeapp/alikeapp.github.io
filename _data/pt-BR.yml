meta:
  title: "Alike — encontre fotos visualmente parecidas no seu iPhone"
  description: "O Alike encontra e agrupa fotos visualmente parecidas na sua fototeca com análise no próprio aparelho, escolhe a melhor foto e ajuda você a apagar o resto. Sem conta, sem servidor, nada sai do seu iPhone."

