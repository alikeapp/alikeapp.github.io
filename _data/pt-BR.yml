hero:
  eyebrow: iPhone
  headline: "Sua fototeca, sem as quase duplicadas."
  subhead: "O Alike agrupa as fotos que se parecem, escolhe a melhor de cada grupo e ajuda você a apagar o resto — sem que uma única foto saia do seu aparelho."
  badge: Em breve na App Store
  badge_note: "Download gratuito, com assinatura Pro opcional."
  trust: "Sem conta. Sem servidor. Nada é enviado."
  image_alt: "O mascote do Alike, um personagem roxo segurando uma lupa sobre duas fotos."

steps:
  title: Como funciona
  subtitle: "Três passos, e em todos eles o controle é seu."
  items:
    - title: Analisar
      body: "O Alike compara sua fototeca com o framework Vision da Apple, inteiramente no seu aparelho. Fotos próximas em tempo e lugar são comparadas; capturas de tela ficam de fora, a menos que você peça para incluí-las."
      image: step-scan
      image_alt: "O mascote procurando entre fotos com uma lupa."
    - title: Revisar
      body: "Cada grupo abre com a melhor foto já escolhida, então você decide em segundos. Manter só a melhor, selecionar tudo exceto a melhor, ou escolher na mão."
      image: step-review
      image_alt: "O mascote comemorando ao lado de uma melhor foto em destaque."
    - title: Limpar
      body: "Você confirma e as fotos escolhidas vão para \"Apagados recentemente\", onde o iOS as guarda por cerca de 30 dias. Nada é removido sem você dizer."
      image: step-clean
      image_alt: "O mascote comemorando ao lado de uma fototeca organizada."

features:
  title: O que você ganha
  items:
    - title: Análise no aparelho
      body: "Cada comparação usa o framework Vision da Apple, localmente. Não há envio, nem fila, nem processamento na nuvem."
    - title: Três níveis de sensibilidade
      body: "Baixo, médio ou alto. Aperte o limite quando quiser só fotos quase idênticas, ou solte para pegar mais."
    - title: Detecção da melhor foto
      body: "Uma escolha determinística da foto mais forte de cada grupo, para que sempre haja uma opção sensata a manter."
    - title: Revisão guiada
      body: "Avance grupo a grupo com \"Manter só a melhor\", \"Selecionar tudo exceto a melhor\" e \"Limpar seleção\"."
    - title: Selos de revisão
      body: "Nova, em revisão, revisada e a revisar depois de uma nova análise. Você sempre sabe onde parou."
    - title: Progresso e espaço liberado
      body: "Revisadas, restantes, selecionadas e economia estimada, além de um histórico de limpeza agrupado por mês."
    - title: Um layout que combina com você
      body: "Uma grade adaptável que alterna entre uma coluna espaçosa e uma visão mais densa, lembrada entre as aberturas."
    - title: Sete idiomas, modo escuro
      body: "Inglês, ucraniano, alemão, francês, espanhol, espanhol da América Latina e português do Brasil em todo o app, com modo escuro completo."

