  subtitle: "Fotoğrafları düzenlemek, en kişisel koleksiyonunu bir uygulamaya emanet etmek demektir. Alike, onun elinden hiç çıkmak zorunda kalmayacağı şekilde kuruldu."
  image_alt: "Maskot, düzenlenmiş ve tamamlanmış bir fotoğraf kitaplığının yanında dinleniyor."
  claims:
    - title: Analiz cihazında çalışır
      body: "Apple'ın Vision çerçevesi fotoğraflarını yerel olarak karşılaştırır. Bir şey gönderilebilecek bir Alike sunucusu yok."
    - title: Fotoğraflar hiçbir zaman yüklenmez
      body: "Hiçbir fotoğraf, küçük resim ya da öznitelik izi cihazından çıkmaz."
    - title: Analitik yok, izleme yok
      body: "Kullanım olayı yok, reklam tanımlayıcısı yok, çökme raporlama SDK'sı yok, çerez yok. Uygulama kendiliğinden ağ isteği yapmaz."
    - title: Silmeye her zaman sen karar verirsin
      body: "Her temizlik senin onayını ister, iOS ikinci kez sorar ve fotoğraflar Son Silinenler'e gider."
  cta: Gizlilik politikasının tamamını oku

