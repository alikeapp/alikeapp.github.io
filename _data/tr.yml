meta:
  title: "Alike — iPhone'unda görsel olarak benzer fotoğrafları bul"
  description: "Alike, kitaplığındaki görsel olarak benzer fotoğrafları cihaz üzerinde analizle bulup gruplar, en iyi kareyi seçer ve geri kalanını temizlemene yardım eder. Hesap yok, sunucu yok, hiçbir şey iPhone'undan çıkmaz."

