faq:
  title: Sık sorulan sorular
  items:
    - q: Alike fotoğraflarımı bir yere yüklüyor mu?
      a: "Hayır. Karşılaştırmanın tamamı cihazında, Apple'ın Vision çerçevesiyle çalışır ve uygulama kendiliğinden ağ isteği yapmaz. Tek dışa dönük işlemi, bir abonelik satın aldığında ya da geri yüklediğinde Apple yürütür."
    - q: Alike sormadan fotoğraf siler mi?
      a: "Asla. Neyin kaldırılacağını sen seçersin, Alike onay ister ve bir şey silinmeden önce iOS kendi onayını gösterir. Silinen fotoğraflar Son Silinenler'e gider, iOS onları yaklaşık 30 gün orada tutar."
    - q: Hesap gerekiyor mu?
      a: "Hayır. Alike'ın hesabı, oturum açması ve sunucusu yok. Uygulamayı açar, başlarsın."
    - q: Alike tam olarak neye erişiyor?
      a: "Fotoğraf kitaplığına — başlangıçta bir kez istenir. Tam erişim ya da sınırlı erişim verip Alike'ın hangi fotoğrafları göreceğini kendin seçebilirsin; bunu istediğin zaman iOS Ayarları'ndan değiştirirsin. Bildirimler yalnızca haftalık temizlik anımsatıcısını açarsan istenir."
    - q: Alike hangi fotoğrafların benzer olduğuna nasıl karar veriyor?
      a: "Vision çerçevesi her fotoğrafa sayısal bir öznitelik izi verir. Zaman ve yer olarak birbirine yakın fotoğraflar karşılaştırılır ve bir fotoğraf, ancak gruptaki hepsine benziyorsa o gruba girer. Duyarlılık düzeyi, benzerin ne kadar benzer sayılacağını belirler."
    - q: En İyi Kare nedir?
      a: "Her gruptaki en güçlü fotoğrafın izlenebilir bir seçimi; saklamak için her zaman makul bir varsayılan olur. İstediğin zaman değiştirebilirsin."
    - q: Aboneliği nasıl iptal ederim?
      a: "iOS Ayarları'nda adına, sonra «Abonelikler»e dokun. İptal, sonraki yenilemeleri durdurur; erişimin ödenmiş dönemin sonuna kadar sürer. Abonelikleri ve iadeleri biz değil Apple yürütür."
    - q: Alike'ın sakladığı her şeyi silebilir miyim?
      a: "Evet. Ayarlar, sonra «Veriler ve Gizlilik», sonra «Alike Verilerini Sil». Bu; tarama sonuçlarını, temizlik geçmişini ve tercihleri siler, fotoğraflarına, fotoğraf erişimine ve aboneliğine dokunmaz."

