hero:
  eyebrow: iPhone
  headline: "Kitaplığın, neredeyse aynı fotoğraflar olmadan."
  subhead: "Alike birbirine benzeyen fotoğrafları gruplar, her grupta en iyi kareyi seçer ve geri kalanını temizlemene yardım eder — üstelik tek bir fotoğraf bile cihazından çıkmadan."
  badge: "App Store'dan indirin"
  badge_note: "Ücretsiz indirilir, isteğe bağlı Pro aboneliğiyle."
  trust: "Hesap yok. Sunucu yok. Hiçbir şey yüklenmez."
  image_alt: "Alike'ın maskotu: iki fotoğrafın üzerinde büyüteç tutan mor bir karakter."

steps:
  title: Nasıl çalışır
  subtitle: "Üç adım, ve her birinde kontrol sende."
  items:
    - title: Tara
      body: "Alike, kitaplığını Apple'ın Vision çerçevesiyle tamamen cihazında karşılaştırır. Zaman ve yer olarak birbirine yakın çekilen fotoğraflar karşılaştırılır; ekran görüntüleri, sen özellikle istemedikçe sonuçlara girmez."
      image: step-scan
      image_alt: "Maskot büyüteçle fotoğrafların arasında arama yapıyor."
    - title: Gözden geçir
      body: "Her grup, en iyi karesi seçili olarak açılır; kararın saniyeler sürer. Yalnızca en iyisini tut, en iyisi hariç tümünü seç ya da elle seç."
      image: step-review
      image_alt: "Maskot, öne çıkarılmış en iyi fotoğrafın yanında seviniyor."
    - title: Temizle
      body: "Onayla; seçtiğin fotoğraflar Son Silinenler'e gider, iOS onları yaklaşık 30 gün orada tutar. Sen demeden hiçbir şey kaldırılmaz."
      image: step-clean
      image_alt: "Maskot, düzenlenmiş bir fotoğraf kitaplığının yanında kutluyor."

features:
  title: Neler var
  items:
    - title: Cihaz üzerinde analiz
      body: "Her karşılaştırma, Apple'ın Vision çerçevesiyle yerel olarak çalışır. Yükleme yok, kuyruk yok, bulutta işleme yok."
    - title: Üç duyarlılık düzeyi
      body: "Düşük, orta ya da yüksek. Yalnızca neredeyse aynı kareleri istiyorsan dar, daha fazlasını yakalamak istiyorsan geniş."
    - title: En İyi Kare algılama
      body: "Her gruptaki en güçlü fotoğrafın izlenebilir bir seçimi; saklamak için her zaman makul bir varsayılan olur."
    - title: Yönlendirilmiş gözden geçirme
      body: "Grup grup ilerle: «Yalnızca en iyisini tut», «En iyisi hariç tümünü seç» ve «Seçimi kaldır»."
    - title: Durum rozetleri
      body: "Yeni, gözden geçiriliyor, gözden geçirildi ve yeni taramadan sonra gözden geçirilmeli. Nerede kaldığını her zaman bilirsin."
    - title: İlerleme ve kazanç
      body: "Gözden geçirilen, kalan, seçilen ve tahmini kazanç, ayrıca aya göre gruplanmış temizlik geçmişi."
    - title: Sana uyan bir düzen
      body: "Ferah tek sütun ile daha sık bir görünüm arasında geçen, tercihini açılışlar arasında hatırlayan uyarlanabilir bir ızgara."
    - title: On iki dil, Koyu Mod
      body: "İngilizce, Ukraynaca, Almanca, Fransızca, İspanyolca, Latin Amerika İspanyolcası, Brezilya Portekizcesi, İtalyanca, Felemenkçe, Lehçe, Türkçe ve Geleneksel Çince, baştan sona, tam Koyu Mod desteğiyle."

