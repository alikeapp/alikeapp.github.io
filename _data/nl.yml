      body: "Apples Vision-framework vergelijkt je foto's lokaal. Er is geen Alike-server om iets naartoe te sturen."
    - title: Foto's worden nooit geüpload
      body: "Geen foto, miniatuur of kenmerkafdruk verlaat ooit je apparaat."
    - title: Geen analytics, geen tracking
      body: "Geen gebruiksgebeurtenissen, geen advertentie-id's, geen crashrapportage-SDK, geen cookies. De app doet uit zichzelf geen netwerkverzoeken."
    - title: Verwijderen doe jij
      body: "Elke opruimactie vraagt je bevestiging, iOS vraagt het een tweede keer, en de foto's belanden in 'Recent verwijderd'."
  cta: Lees het volledige privacybeleid

