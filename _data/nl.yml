steps:
  title: Zo werkt het
  subtitle: "Drie stappen, en bij elke stap houd jij de controle."
  items:
    - title: Scannen
      body: "Alike vergelijkt je bibliotheek met Apples Vision-framework, volledig op je apparaat. Foto's die qua tijd en plaats dicht bij elkaar liggen worden vergeleken; schermafbeeldingen blijven erbuiten tenzij je ze uitdrukkelijk meeneemt."
      image: step-scan
      image_alt: "De mascotte zoekt met een vergrootglas door foto's."
    - title: Bekijken
      body: "Elke groep opent met een beste opname die al gekozen is, zodat je in seconden beslist. Alleen de beste bewaren, alles behalve de beste selecteren of met de hand kiezen."
      image: step-review
      image_alt: "De mascotte lacht naast een uitgelichte beste foto."
    - title: Opruimen
      body: "Bevestig, en de geselecteerde foto's gaan naar 'Recent verwijderd', waar iOS ze ongeveer 30 dagen bewaart. Er verdwijnt nooit iets zonder jouw woord."
      image: step-clean
      image_alt: "De mascotte juicht naast een opgeruimde fotobibliotheek."

features:
  title: Wat je krijgt
  items:
    - title: Analyse op het apparaat
      body: "Elke vergelijking draait lokaal via Apples Vision-framework. Geen upload, geen wachtrij, geen verwerking in de cloud."
    - title: Drie niveaus van gevoeligheid
      body: "Laag, gemiddeld of hoog. Strakker als je alleen bijna identieke opnamen wilt, ruimer om meer te vangen."
    - title: Beste opname herkennen
      body: "Een navolgbare keuze van de sterkste foto in elke groep, zodat er altijd een verstandige standaardkeuze klaarstaat."
    - title: Begeleid bekijken
      body: "Werk groep voor groep met 'Alleen de beste bewaren', 'Selecteer alles behalve de beste' en 'Deselecteer'."
    - title: Statuslabels
      body: "Nieuw, wordt bekeken, bekeken en na een nieuwe scan opnieuw te bekijken. Je weet altijd waar je gebleven was."
    - title: Voortgang en besparing
      body: "Bekeken, resterend, geselecteerd en geschatte besparing, plus een opruimgeschiedenis per maand."
    - title: Een indeling die bij je past
      body: "Een meegroeiend raster dat wisselt tussen een ruime kolom en een dichtere weergave, en dat tussen sessies onthouden wordt."
    - title: Twaalf talen, donkere modus
      body: "Engels, Oekraïens, Duits, Frans, Spaans, Latijns-Amerikaans Spaans, Braziliaans Portugees, Italiaans, Nederlands, Pools, Turks en traditioneel Chinees, overal, met een volledige donkere modus."

