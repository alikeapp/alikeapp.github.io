faq:
  title: Veelgestelde vragen
  items:
    - q: Uploadt Alike mijn foto's ergens naartoe?
      a: "Nee. De hele vergelijking draait op je apparaat met Apples Vision-framework, en de app doet uit zichzelf geen netwerkverzoeken. De enige uitgaande activiteit regelt Apple, wanneer je een abonnement koopt of herstelt."
    - q: Verwijdert Alike foto's zonder te vragen?
      a: "Nooit. Jij kiest wat weg mag, Alike vraagt je om bevestiging, en iOS toont zijn eigen bevestiging voordat er iets verdwijnt. Verwijderde foto's gaan naar 'Recent verwijderd', waar iOS ze ongeveer 30 dagen bewaart."
    - q: Heb ik een account nodig?
      a: "Nee. Alike heeft geen account, geen inlog en geen server. Je opent de app en begint."
    - q: Waar krijgt Alike eigenlijk toegang toe?
      a: "Tot je fotobibliotheek, één keer aan het begin gevraagd. Je kunt volledige toegang geven of beperkte toegang en zelf kiezen welke foto's Alike mag zien; dat kun je altijd wijzigen in de iOS-instellingen. Om berichtgevingen wordt alleen gevraagd als je de wekelijkse opruimherinnering aanzet."
    - q: Hoe bepaalt Alike welke foto's op elkaar lijken?
      a: "Elke foto krijgt van het Vision-framework een numerieke kenmerkafdruk. Foto's die qua tijd en plaats dicht bij elkaar liggen worden vergeleken, en een foto komt alleen in een groep als hij op alle foto's daarin lijkt. Het gevoeligheidsniveau bepaalt hoe gelijkend gelijkend genoeg is."
    - q: Wat is de beste opname?
      a: "Een navolgbare keuze van de sterkste foto in elke groep, zodat er altijd een verstandige standaardkeuze klaarstaat. Je kunt die altijd overrulen."
    - q: Hoe zeg ik een abonnement op?
      a: "Tik in de iOS-instellingen op je naam en dan op 'Abonnementen'. Opzeggen stopt toekomstige verlengingen, en je houdt toegang tot het einde van de betaalde periode. Abonnementen en terugbetalingen regelt Apple, niet wij."
    - q: Kan ik alles verwijderen wat Alike heeft bewaard?
      a: "Ja. Instellingen, dan 'Gegevens en privacy', dan 'Verwijder Alike-gegevens'. Dat wist scanresultaten, opruimgeschiedenis en voorkeuren en laat je foto's, de fototoegang en je abonnement onaangeroerd."

