  title: "Alike — visueel vergelijkbare foto's vinden op je iPhone"
  description: "Alike vindt en groepeert visueel vergelijkbare foto's in je bibliotheek met analyse op het apparaat zelf, kiest de beste opname en helpt je de rest op te ruimen. Geen account, geen server, niets verlaat je iPhone."

