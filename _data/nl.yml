  subtitle: "Foto's opruimen betekent dat je een app je persoonlijkste verzameling toevertrouwt. Alike is zo gebouwd dat die nooit uit je handen hoeft."
  image_alt: "De mascotte rust naast een opgeruimde, afgeronde fotobibliotheek."
  claims:
