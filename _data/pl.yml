meta:
  title: "Alike — znajdź wizualnie podobne zdjęcia na iPhonie"
  description: "Alike znajduje i grupuje wizualnie podobne zdjęcia w Twojej bibliotece, analizując je na urządzeniu, wybiera najlepsze ujęcie i pomaga uporządkować resztę. Bez konta, bez serwera, nic nie opuszcza Twojego iPhone'a."

