privacy:
  title: Prywatność to cały sens
  subtitle: "Porządkowanie zdjęć oznacza powierzenie aplikacji najbardziej osobistej kolekcji, jaką masz. Alike jest zbudowany tak, żeby nigdy nie musiała opuścić Twoich rąk."
  image_alt: "Maskotka odpoczywa obok uporządkowanej, gotowej biblioteki zdjęć."
  claims:
    - title: Analiza działa na Twoim urządzeniu
      body: "Framework Vision od Apple porównuje zdjęcia lokalnie. Nie ma serwera Alike, na który dałoby się cokolwiek wysłać."
    - title: Zdjęcia nigdy nie są wysyłane
      body: "Żadne zdjęcie, miniatura ani odcisk cech nigdy nie opuszcza Twojego urządzenia."
    - title: Bez analityki, bez śledzenia
      body: "Bez zdarzeń użycia, bez identyfikatorów reklamowych, bez SDK do raportowania awarii, bez ciasteczek. Aplikacja sama z siebie nie wykonuje żadnych zapytań sieciowych."
    - title: O usuwaniu decydujesz Ty
      body: "Każde porządki wymagają Twojego potwierdzenia, iOS pyta drugi raz, a zdjęcia trafiają do albumu „Ostatnio usunięte”."
  cta: Przeczytaj pełną politykę prywatności

