faq:
  title: Częste pytania
  items:
    - q: Czy Alike gdzieś wysyła moje zdjęcia?
      a: "Nie. Całe porównywanie działa na Twoim urządzeniu, na frameworku Vision od Apple, a aplikacja sama z siebie nie wykonuje zapytań sieciowych. Jedyny ruch wychodzący obsługuje Apple, kiedy kupujesz albo przywracasz subskrypcję."
    - q: Czy Alike usuwa zdjęcia bez pytania?
      a: "Nigdy. To Ty wybierasz, co ma zniknąć, Alike prosi o potwierdzenie, a iOS pokazuje własne potwierdzenie, zanim cokolwiek zostanie usunięte. Usunięte zdjęcia trafiają do albumu „Ostatnio usunięte”, gdzie iOS trzyma je około 30 dni."
    - q: Czy potrzebuję konta?
      a: "Nie. Alike nie ma konta, logowania ani serwera. Otwierasz aplikację i zaczynasz."
    - q: Do czego właściwie ma dostęp Alike?
      a: "Do Twojej biblioteki zdjęć, o co pyta raz na początku. Możesz przyznać pełny dostęp albo dostęp ograniczony i sam wybrać, które zdjęcia Alike widzi; zmienisz to w dowolnej chwili w Ustawieniach iOS. O powiadomienia pytamy tylko wtedy, gdy włączysz cotygodniowe przypomnienie o porządkach."
    - q: Jak Alike decyduje, które zdjęcia są podobne?
      a: "Framework Vision nadaje każdemu zdjęciu numeryczny odcisk cech. Porównywane są zdjęcia zrobione blisko siebie w czasie i miejscu, a zdjęcie trafia do grupy tylko wtedy, gdy jest podobne do wszystkich już w niej obecnych. Poziom czułości ustala, jak podobne znaczy wystarczająco podobne."
    - q: Czym jest najlepsze ujęcie?
      a: "Zdjęcie, które Alike proponuje zachować w każdej grupie, wybrane na podstawie samych zdjęć — ostrości, ekspozycji, twarzy i szumu — a nie ulubionych czy rozmiaru pliku. Zawsze możesz je zmienić, a im częściej to robisz, tym bliżej Twojego gustu są propozycje."
    - q: Czy Alike może zmieniać moje zdjęcia?
      a: "Tylko jeśli go o to poprosisz. Możesz poprawić najlepsze ujęcie w grupie: Alike najpierw pokazuje wynik i zapisuje go dopiero wtedy, gdy go zastosujesz. Oryginał zachowuje iOS, więc jeden krok go przywraca, a Zdjęcia Apple też cofną tę zmianę."
    - q: Czy Alike uczy się z moich wyborów?
      a: "Tak, wyłącznie z Twoich własnych wyborów. Kiedy wybierzesz inne najlepsze ujęcie, Alike zapamiętuje, co wolałeś, i układa kolejne grupy bliżej tego. Wszystko zostaje na Twoim urządzeniu. W ustawieniach możesz wyzerować to, czego Alike się nauczył."
    - q: Jak anulować subskrypcję?
      a: "W Ustawieniach iOS dotknij swojego imienia, a potem „Subskrypcje”. Anulowanie zatrzymuje przyszłe odnowienia, a dostęp zostaje do końca opłaconego okresu. Subskrypcje i zwroty obsługuje Apple, nie my."
    - q: Czy mogę usunąć wszystko, co Alike zapisał?
      a: "Tak. Ustawienia, potem „Dane i prywatność”, potem „Usuń dane Alike”. Kasuje to wyniki skanowania, historię porządków, ustawienia i to, czego nauczyło się najlepsze ujęcie. Twoich zdjęć, dostępu do zdjęć ani subskrypcji nie rusza — a poprawione zdjęcie zostaje poprawione, bo przywrócenie oryginału to osobny krok."

