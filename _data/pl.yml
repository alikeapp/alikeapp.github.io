hero:
  eyebrow: iPhone
  headline: "Twoja biblioteka, bez prawie identycznych zdjęć."
  subhead: "Alike grupuje zdjęcia, które wyglądają podobnie, wybiera w każdej grupie najlepsze ujęcie i pomaga uporządkować resztę — a żadne zdjęcie nie opuszcza Twojego urządzenia."
  badge: Pobierz w App Store
  badge_note: "Pobranie za darmo, z opcjonalną subskrypcją Pro."
  trust: "Bez konta. Bez serwera. Nic nie jest wysyłane."
  image_alt: "Maskotka Alike, fioletowa postać z lupą nad dwoma zdjęciami."

steps:
  title: Jak to działa
  subtitle: "Trzy kroki, a przy każdym decydujesz Ty."
  items:
    - title: Skanuj
      body: "Alike porównuje Twoją bibliotekę za pomocą frameworka Vision od Apple, w całości na urządzeniu. Porównywane są zdjęcia zrobione blisko siebie w czasie i miejscu; zrzuty ekranu zostają poza wynikami, chyba że wyraźnie je włączysz."
      image: step-scan
      image_alt: "Maskotka przegląda zdjęcia z lupą."
    - title: Przejrzyj
      body: "Każda grupa otwiera się z już wybranym najlepszym ujęciem, więc decyzja zajmuje sekundy. Zostaw tylko najlepsze, zaznacz wszystkie oprócz najlepszego albo wybierz ręcznie."
      image: step-review
      image_alt: "Maskotka cieszy się obok wyróżnionego najlepszego zdjęcia."
    - title: Uporządkuj
      body: "Potwierdź, a wybrane zdjęcia trafią do albumu „Ostatnio usunięte”, gdzie iOS trzyma je około 30 dni. Nic nie znika bez Twojej zgody."
      image: step-clean
      image_alt: "Maskotka świętuje obok uporządkowanej biblioteki zdjęć."

features:
  title: Co dostajesz
  items:
    - title: Analiza na urządzeniu
      body: "Każde porównanie działa lokalnie, na frameworku Vision od Apple. Bez wysyłania, bez kolejki, bez przetwarzania w chmurze."
    - title: Trzy poziomy czułości
      body: "Niska, średnia albo wysoka. Zawęź próg, aby znaleźć tylko niemal identyczne ujęcia, lub poszerz go, aby znaleźć więcej podobnych zdjęć."
    - title: Wykrywanie najlepszego ujęcia
      body: "Wybrane na podstawie samych zdjęć — ostrości, ekspozycji, twarzy i szumu — żeby zawsze był sensowny domyślny kandydat do zachowania. Alike uczy się też na podstawie ujęć, które wybierasz sam."
    - title: Prowadzony przegląd
      body: "Pracuj grupa po grupie z opcjami „Zostaw tylko najlepsze”, „Zaznacz wszystkie oprócz najlepszego” i „Odznacz”."
    - title: Znaczniki stanu
      body: "Nowe, w trakcie przeglądu, przejrzane i wymagające przeglądu po ponownym skanowaniu. Zawsze wiesz, gdzie skończyłeś."
    - title: Postęp i oszczędność
      body: "Przejrzane, pozostałe, wybrane i szacowana oszczędność, a do tego historia porządków pogrupowana według miesięcy."
    - title: Układ dopasowany do Ciebie
      body: "Elastyczna siatka, która przełącza się między przestronną jedną kolumną a gęstszym widokiem i zapamiętuje wybór między uruchomieniami."
    - title: 18 wariantów językowych i tryb ciemny
      body: "Angielski oraz jego warianty brytyjski, kanadyjski i australijski, ukraiński, niemiecki, francuski i francuski kanadyjski, hiszpański i hiszpański latynoamerykański, portugalski brazylijski i europejski, włoski, niderlandzki, polski, turecki, chiński tradycyjny i arabski w całej aplikacji, z pełną obsługą trybu ciemnego."
    - title: Ulepsz i cofnij
      body: "Ulepsz zdjęcie, które zachowujesz, jednym dotknięciem. Oryginał zostaje w bibliotece, a jeden krok go przywraca."
    - title: Widgety na ekranie początkowym i na ekranie blokady
      body: "Dwa widgety, oba bezpłatne. Jeden pokazuje, ile miejsca możesz odzyskać, i pozwala wrócić do nieukończonego przeglądu; drugi wyświetla grupy podobnych zdjęć, zrzuty ekranu i rozmyte zdjęcia, a każdy wiersz otwiera własną listę. Od 1.5.0 pierwszy występuje też w trzech rozmiarach na ekran blokady: wiersz nad zegarem, karta i pierścień."

