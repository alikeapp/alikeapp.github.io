  title: "Alike — usuwaj podobne zdjęcia i zwalniaj miejsce na iPhonie"
  description: "Znajdź duplikaty i podobne zdjęcia na iPhonie. Alike wybiera najlepsze ujęcie i pomaga zwolnić pamięć. Bez konta, reklam i wysyłania zdjęć."

