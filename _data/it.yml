faq:
  title: Domande frequenti
  items:
    - q: Alike carica le mie foto da qualche parte?
      a: "No. Tutto il confronto avviene sul tuo dispositivo con il framework Vision di Apple, e l'app non fa richieste di rete di propria iniziativa. L'unica attività in uscita la gestisce Apple, quando acquisti o ripristini un abbonamento."
    - q: Alike elimina foto senza chiedere?
      a: "Mai. Sei tu a scegliere cosa rimuovere, Alike ti chiede conferma e iOS mostra la propria conferma prima che qualcosa venga eliminato. Le foto eliminate finiscono in «Eliminati di recente», dove iOS le conserva per circa 30 giorni."
    - q: Serve un account?
      a: "No. Alike non ha account, non ha accesso e non ha server. Apri l'app e inizi."
    - q: A cosa accede esattamente Alike?
      a: "Alla tua libreria di foto, richiesta una sola volta all'inizio. Puoi concedere l'accesso completo oppure l'accesso limitato e scegliere tu quali foto Alike può vedere; puoi cambiare idea in qualsiasi momento in Impostazioni di iOS. Le notifiche vengono richieste solo se attivi il promemoria settimanale di pulizia."
    - q: Come decide Alike quali foto sono simili?
      a: "Il framework Vision assegna a ogni foto un'impronta numerica. Vengono confrontate le foto vicine nel tempo e nel luogo, e una foto entra in un gruppo solo se somiglia a tutte quelle già presenti. Il livello di sensibilità stabilisce quanto simile sia abbastanza simile."
    - q: Cos'è lo scatto migliore?
      a: "Una scelta comprensibile della foto più riuscita di ogni gruppo, così c'è sempre un'opzione sensata da tenere. Puoi sempre sovrascriverla."
    - q: Come annullo un abbonamento?
      a: "In Impostazioni di iOS tocca il tuo nome, poi «Abbonamenti». L'annullamento ferma i rinnovi futuri, e l'accesso resta fino alla fine del periodo pagato. Abbonamenti e rimborsi li gestisce Apple, non noi."
    - q: Posso eliminare tutto quello che Alike ha salvato?
      a: "Sì. Impostazioni, poi «Dati e privacy», poi «Elimina i dati di Alike». Cancella risultati delle scansioni, cronologia pulizia e preferenze, e lascia intatti le tue foto, l'accesso alle foto e l'abbonamento."

