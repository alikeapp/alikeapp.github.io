# Registro: sempre il "tu", come nella comunicazione della paywall in
# Docs/legal/subscription-disclosure.md. I termini di sistema seguono la
# terminologia italiana di Apple — «Eliminati di recente», «Screenshot».
meta:
  title: "Alike — trova le foto visivamente simili sul tuo iPhone"
  description: "Alike trova e raggruppa le foto visivamente simili nella tua libreria con analisi direttamente sul dispositivo, sceglie lo scatto migliore e ti aiuta a eliminare il resto. Nessun account, nessun server, niente lascia il tuo iPhone."

