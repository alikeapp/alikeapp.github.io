hero:
  eyebrow: iPhone
  headline: "La tua libreria, senza i quasi-doppioni."
  subhead: "Alike raggruppa le foto che si somigliano, sceglie lo scatto migliore di ogni gruppo e ti aiuta a eliminare il resto — senza che una sola foto lasci il tuo dispositivo."
  badge: Scarica su App Store
  badge_note: "Download gratuito, con abbonamento Pro facoltativo."
  trust: "Nessun account. Nessun server. Niente viene caricato online."
  image_alt: "La mascotte di Alike, un personaggio viola con una lente d'ingrandimento sopra due foto."

steps:
  title: Come funziona
  subtitle: "Tre passaggi, e a ognuno mantieni il controllo."
  items:
    - title: Scansiona
      body: "Alike confronta la tua libreria con il framework Vision di Apple, interamente sul tuo dispositivo. Vengono confrontate le foto vicine nel tempo e nel luogo; gli screenshot restano fuori se non li richiedi espressamente."
      image: step-scan
      image_alt: "La mascotte cerca tra le foto con una lente d'ingrandimento."
    - title: Controlla
      body: "Ogni gruppo si apre con lo scatto migliore già selezionato, così decidi in pochi secondi. Tieni solo la migliore, seleziona tutte tranne la migliore oppure scegli a mano."
      image: step-review
      image_alt: "La mascotte sorride accanto a una foto migliore evidenziata."
    - title: Pulisci
      body: "Conferma, e le foto selezionate finiscono in «Eliminati di recente», dove iOS le conserva per circa 30 giorni. Niente viene rimosso senza il tuo assenso."
      image: step-clean
      image_alt: "La mascotte esulta accanto a una libreria di foto in ordine."

features:
  title: Cosa ottieni
  items:
    - title: Analisi sul dispositivo
      body: "Ogni confronto avviene in locale, con il framework Vision di Apple. Nessun caricamento, nessuna coda, nessuna elaborazione nel cloud."
    - title: Tre livelli di sensibilità
      body: "Bassa, media o alta. Più stretta se vuoi solo gli scatti quasi identici, più ampia per prendere di più."
    - title: Riconoscimento dello scatto migliore
      body: "Una scelta comprensibile della foto più riuscita di ogni gruppo, così c'è sempre un'opzione sensata da tenere."
    - title: Controllo guidato
      body: "Procedi gruppo per gruppo con «Tieni solo la migliore», «Seleziona tutte tranne la migliore» e «Deseleziona»."
    - title: Indicatori di stato
      body: "Nuovo, in controllo, controllato e da rivedere dopo una nuova scansione. Sai sempre dove eri rimasto."
    - title: Avanzamento e risparmio
      body: "Controllate, rimanenti, selezionate e risparmio stimato, più una cronologia pulizia raggruppata per mese."
    - title: Un layout che ti somiglia
      body: "Una griglia adattiva che passa da una colonna ampia a una vista più fitta e ricorda la tua scelta tra un avvio e l'altro."
    - title: Dodici lingue, modalità scura
      body: "Inglese, ucraino, tedesco, francese, spagnolo, spagnolo latinoamericano, portoghese brasiliano, italiano, olandese, polacco, turco e cinese tradizionale, ovunque, con modalità scura completa."

