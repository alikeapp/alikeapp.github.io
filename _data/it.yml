privacy:
  title: La privacy è tutto il punto
  subtitle: "Fare ordine tra le foto significa affidare a un'app la tua raccolta più personale. Alike è costruita perché non debba mai lasciare le tue mani."
  image_alt: "La mascotte riposa accanto a una libreria di foto ordinata e completata."
  claims:
    - title: L'analisi avviene sul tuo dispositivo
      body: "Il framework Vision di Apple confronta le tue foto in locale. Non esiste un server Alike a cui inviare qualcosa."
    - title: Le foto non vengono mai caricate
      body: "Nessuna foto, miniatura o impronta caratteristica lascia mai il tuo dispositivo."
    - title: Nessuna analisi statistica, nessun tracciamento
      body: "Nessun evento d'uso, nessun identificativo pubblicitario, nessun SDK di crash reporting, nessun cookie. L'app non fa richieste di rete di propria iniziativa."
    - title: A eliminare sei sempre tu
      body: "Ogni pulizia richiede la tua conferma, iOS chiede una seconda volta e le foto finiscono in «Eliminati di recente»."
  cta: Leggi l'informativa sulla privacy completa

